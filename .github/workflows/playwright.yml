name: Playwright Tests

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Functional and security tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check formatting
        run: npx prettier --check .

      - name: Type check
        run: npx tsc --noEmit

      - name: Run functional and security tests
        run: npx playwright test --project=chromium --grep-invert @performance
        env:
          TEST_USER_USERNAME: ${{ secrets.TEST_USER_USERNAME }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_USER_FIRST_NAME: ${{ secrets.TEST_USER_FIRST_NAME }}
          TEST_USER_LAST_NAME: ${{ secrets.TEST_USER_LAST_NAME }}
          TEST_USER_COMPANY: ${{ secrets.TEST_USER_COMPANY }}
          TEST_USER_COUNTRY: ${{ secrets.TEST_USER_COUNTRY }}
          TEST_USER_ADDRESS: ${{ secrets.TEST_USER_ADDRESS }}
          TEST_USER_CITY: ${{ secrets.TEST_USER_CITY }}
          TEST_USER_STATE: ${{ secrets.TEST_USER_STATE }}
          TEST_USER_POSTCODE: ${{ secrets.TEST_USER_POSTCODE }}
          TEST_USER_PHONE: ${{ secrets.TEST_USER_PHONE }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  performance:
    name: Checkout performance
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run checkout performance test
        run: npx playwright test tests/performance/checkout-performance.spec.ts --project=chromium
        env:
          TEST_USER_USERNAME: ${{ secrets.TEST_USER_USERNAME }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_USER_FIRST_NAME: ${{ secrets.TEST_USER_FIRST_NAME }}
          TEST_USER_LAST_NAME: ${{ secrets.TEST_USER_LAST_NAME }}
          TEST_USER_COMPANY: ${{ secrets.TEST_USER_COMPANY }}
          TEST_USER_COUNTRY: ${{ secrets.TEST_USER_COUNTRY }}
          TEST_USER_ADDRESS: ${{ secrets.TEST_USER_ADDRESS }}
          TEST_USER_CITY: ${{ secrets.TEST_USER_CITY }}
          TEST_USER_STATE: ${{ secrets.TEST_USER_STATE }}
          TEST_USER_POSTCODE: ${{ secrets.TEST_USER_POSTCODE }}
          TEST_USER_PHONE: ${{ secrets.TEST_USER_PHONE }}

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-performance-report
          path: playwright-report/
          retention-days: 7
